<style>
html { -webkit-text-size-adjust: 100%; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
.login { min-height: 100vh; display: grid; place-items: center; padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--side); }
.login-card { width: min(400px, 100%); background: var(--surface); border-radius: 20px; padding: 28px 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 12px 40px rgba(0, 0, 0, .3); }
.login-card .brand { padding: 0; }
.login-card .brand-name span { color: var(--muted); }
.login-card .err { color: var(--bad); font-size: 13.5px; font-weight: 500; margin: 0; }
.soon b { overflow-wrap: anywhere; }
.subareas { padding: 10px 12px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); }
.sub-lbl { font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.chip.sub { min-height: 36px; font-size: 13px; }
.sub-h { display: flex; align-items: center; gap: 10px; margin: 0; padding: 13px 16px; font-family: var(--f-display); font-size: 17px; font-weight: 700; color: var(--ink); background: var(--surface-2); border-top: 8px solid var(--bg); border-bottom: 2px solid var(--line-2); }
.sub-h:first-of-type { border-top: none; }
/* Subdivisión: celeste suave (azul de la marca), distinto del color del área */
.sub-h.bsf, .sub-h.kovacs, .sub-h.general { background: color-mix(in srgb, var(--accent-soft) 75%, var(--surface)); border-bottom-color: var(--accent); }
.sub-h svg { width: 20px; height: 20px; color: var(--accent); stroke-width: 2.2; }
.sub-h .sub-n { font-family: var(--f-body); font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line-2); color: var(--ink); }
.solo-cel { display: none; }
@media (max-width: 699px) { .btn.solo-cel { display: inline-flex; margin-top: 8px; } }
.tbl tbody tr.grp td, .tbl tbody tr.grp:hover td { background: var(--gen-soft); color: var(--gen-ink); font-family: var(--f-display); font-weight: 700; font-size: 16px; padding-top: 12px; padding-bottom: 12px; border-top: 2px solid var(--line-2); cursor: default; }
.tbl tbody tr.grp.bsf td, .tbl tbody tr.grp.bsf:hover td { background: var(--bsf-soft); color: var(--bsf-ink); }
.tbl tbody tr.grp.kovacs td, .tbl tbody tr.grp.kovacs:hover td { background: var(--kov-soft); color: var(--kov-ink); }
.tbl tr.grp .g-div { font-family: var(--f-body); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; margin-right: 8px; }
.tbl tr.grp .g-cnt { font-family: var(--f-body); font-size: 12.5px; font-weight: 600; margin-left: 8px; padding: 2px 8px; border-radius: 999px; background: var(--surface); color: var(--ink); }
.brand-logo { display: flex; flex-direction: column; gap: 6px; padding: 2px 6px 0; }
.brand-logo img { width: 200px; max-width: 100%; height: auto; display: block; }
.brand-logo span { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--side-muted); padding-left: 2px; }
.top-logo { height: 37px; width: auto; display: block; }
.login-logo { display: block; align-self: center; }
.login-logo img { width: 280px; max-width: 100%; height: auto; display: block; }
.login-tag { margin: -6px 0 4px; text-align: center; font-size: 11.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
/* Layout: barra lateral oscura fija (computador) / barra superior + menú inferior (celular); contenido en tarjetas. */
:root {
  --bg: #F2F5F7; --surface: #FFFFFF; --surface-2: #F7F9FA; --line: #E0E6EB; --line-2: #CBD4DC;
  --ink: #0E1A24; --muted: #4A5866; --faint: #5F6D7A;
  --side: #0F1B24; --side-ink: #E3EAF0; --side-muted: #9AACBA; --side-active: #1C2E3B; --side-line: #22333F;
  --accent: #007CAD; --accent-ink: #FFFFFF; --accent-soft: #E0F3FB; --accent-strong: #00668F; --brand: #00A0E0;
  --bsf: #C2410C; --bsf-soft: #FFEDD5; --bsf-ink: #9A3412;
  --kov: #7C3AED; --kov-soft: #EDE9FE; --kov-ink: #5B21B6;
  --gen: #64748B; --gen-soft: #E6EBF0; --gen-ink: #334155;
  --ok: #166534; --ok-soft: #DCFCE7; --warn: #8A3B07; --warn-soft: #FEF3C7; --bad: #991B1B; --bad-soft: #FEE2E2;
  --none: #4A5866; --none-soft: #EDF1F4; --new: #0F766E; --new-soft: #D5F5EF;
  --c1: #0F766E; --c2: #EA580C; --c3: #2563EB; --c4: #9333EA; --c5: #DB2777; --c6: #65A30D; --c7: #CA8A04; --c8: #475569; --c9: #0891B2; --c10: #B91C1C;
  --shadow: 0 1px 2px rgba(15, 27, 36, .05), 0 1px 1px rgba(15, 27, 36, .03);
  --overlay: rgba(9, 16, 22, .45);
  --f-display: "Space Grotesk", "Inter", system-ui, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1117; --surface: #111B23; --surface-2: #15212B; --line: #22313C; --line-2: #2F404D;
    --ink: #E6EDF2; --muted: #A6B5C1; --faint: #93A3B0;
    --side: #060C11; --side-ink: #E3EAF0; --side-muted: #94A6B4; --side-active: #15232E; --side-line: #1A2833;
    --accent: #00A0E0; --accent-ink: #04202E; --accent-soft: #0B2A3A; --accent-strong: #4CC2F0; --brand: #00A0E0;
    --bsf: #FB923C; --bsf-soft: #3A1E0E; --bsf-ink: #FDBA74;
    --kov: #A78BFA; --kov-soft: #2A1F4A; --kov-ink: #C4B5FD;
    --gen: #94A3B8; --gen-soft: #1D2935; --gen-ink: #CBD5E1;
    --ok: #86EFAC; --ok-soft: #0F2E1C; --warn: #FCD34D; --warn-soft: #362A0A; --bad: #FCA5A5; --bad-soft: #3A1414;
    --none: #A6B5C1; --none-soft: #1B2731; --new: #5EEAD4; --new-soft: #0F2E2B;
    --c1: #2CB5A6; --c2: #FB923C; --c3: #60A5FA; --c4: #C084FC; --c5: #F472B6; --c6: #A3E635; --c7: #FACC15; --c8: #94A3B8; --c9: #22D3EE; --c10: #F87171;
    --shadow: none; --overlay: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1117; --surface: #111B23; --surface-2: #15212B; --line: #22313C; --line-2: #2F404D;
  --ink: #E6EDF2; --muted: #A6B5C1; --faint: #93A3B0;
  --side: #060C11; --side-ink: #E3EAF0; --side-muted: #94A6B4; --side-active: #15232E; --side-line: #1A2833;
  --accent: #00A0E0; --accent-ink: #04202E; --accent-soft: #0B2A3A; --accent-strong: #4CC2F0; --brand: #00A0E0;
  --bsf: #FB923C; --bsf-soft: #3A1E0E; --bsf-ink: #FDBA74;
  --kov: #A78BFA; --kov-soft: #2A1F4A; --kov-ink: #C4B5FD;
  --gen: #94A3B8; --gen-soft: #1D2935; --gen-ink: #CBD5E1;
  --ok: #86EFAC; --ok-soft: #0F2E1C; --warn: #FCD34D; --warn-soft: #362A0A; --bad: #FCA5A5; --bad-soft: #3A1414;
  --none: #A6B5C1; --none-soft: #1B2731; --new: #5EEAD4; --new-soft: #0F2E2B;
  --c1: #2CB5A6; --c2: #FB923C; --c3: #60A5FA; --c4: #C084FC; --c5: #F472B6; --c6: #A3E635; --c7: #FACC15; --c8: #94A3B8; --c9: #22D3EE; --c10: #F87171;
  --shadow: none; --overlay: rgba(0, 0, 0, .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-family: var(--f-display); font-size: 28px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.15; }
h2 { font-size: 15px; font-weight: 600; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
svg.i { width: 20px; height: 20px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Shell ---------- */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--side); color: var(--side-ink); padding-block: 22px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; display: flex; flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.brand-mark { width: 40px; height: 40px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 16px; letter-spacing: .02em; }
.brand-name { display: flex; flex-direction: column; line-height: 1.2; }
.brand-name b { font-family: var(--f-display); font-size: 17px; }
.brand-name span { font-size: 12px; color: var(--side-muted); }
.side .brand-name span { color: var(--side-muted); }
.btn-new { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; border-radius: 22px; border: 1.5px solid var(--side-muted); background: transparent; color: var(--side-ink); font-weight: 600; cursor: pointer; }
.btn-new:hover { background: var(--side-active); }
.side-nav { display: flex; flex-direction: column; gap: 2px; }
.side-nav a { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; color: var(--side-muted); text-decoration: none; font-weight: 500; font-size: 14px; }
.side-nav a:hover { color: var(--side-ink); background: var(--side-active); }
.side-nav a[aria-current="page"] { background: var(--side-active); color: var(--side-ink); font-weight: 600; box-shadow: inset 3px 0 0 var(--accent); }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
.soon { display: flex; gap: 10px; padding: 12px; border-radius: 12px; border: 1px dashed var(--side-line); font-size: 12px; color: var(--side-muted); line-height: 1.4; }
.soon b { color: var(--side-ink); font-weight: 600; }
.conn { font-size: 12px; color: var(--side-muted); display: flex; align-items: center; gap: 8px; padding: 0 8px; }
.dot { width: 8px; height: 8px; border-radius: 4px; background: var(--side-muted); flex-shrink: 0; }
.dot.on { background: #34D399; }
.dot.off { background: #F87171; }

.topbar { display: none; }
.tabs { display: none; }
.main { min-width: 0; padding-block: 28px 48px; padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; max-width: 1360px; width: 100%; }

@media (max-width: 899px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--side); }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--side); color: var(--side-ink); padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .topbar .brand { padding: 0; }
  .topbar .brand-mark { width: 36px; height: 36px; font-size: 14px; }
  .main { padding-block: 18px 110px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 16px; }
  .tabs { display: flex; justify-content: space-around; position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
  .tabs a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-width: 60px; min-height: 48px; text-decoration: none; color: var(--muted); font-size: 11.5px; font-weight: 500; border-radius: 10px; }
  .tabs a[aria-current="page"] { color: var(--accent); font-weight: 600; }
  h1 { font-size: 25px; }
}
.icon-btn { width: 44px; height: 44px; border-radius: 12px; border: none; background: transparent; color: inherit; display: grid; place-items: center; cursor: pointer; }
.topbar .icon-btn { background: var(--side-active); }

/* ---------- Common ---------- */
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; }
.eyebrow { font-size: 13px; color: var(--muted); }
.sub { font-size: 14px; color: var(--muted); margin-top: 4px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 11px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
.btn.danger { color: var(--bad); border-color: var(--bad-soft); background: var(--surface); }
.btn.danger:hover { background: var(--bad-soft); }
.btn.danger.solid { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); padding: 0 10px; }
.btn.ghost:hover { background: var(--accent-soft); }
.btn.big { min-height: 54px; font-size: 16px; border-radius: 14px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.link { background: none; border: none; padding: 0; color: var(--accent); font-weight: 600; cursor: pointer; font-size: inherit; text-align: left; }
.link:hover { text-decoration: underline; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.card-title { font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.card-sub { font-size: 12.5px; color: var(--muted); }
.big-num { font-family: var(--f-display); font-size: 32px; font-weight: 700; line-height: 1.05; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.big-num small { font-size: 14px; font-weight: 500; color: var(--muted); font-family: var(--f-body); letter-spacing: 0; }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 3px 8px; border-radius: 8px; white-space: nowrap; line-height: 1.3; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.none { background: var(--none-soft); color: var(--none); }
.pill.new { background: var(--new-soft); color: var(--new); }
.pill.bsf { background: var(--bsf-soft); color: var(--bsf-ink); }
.pill.kovacs { background: var(--kov-soft); color: var(--kov-ink); }
.pill.general { background: var(--gen-soft); color: var(--gen-ink); }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex-shrink: 0; }

.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.search { flex: 1 1 260px; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; color: var(--faint); }
.search input { flex: 1; min-width: 0; border: none; outline: none; background: transparent; color: var(--ink); font-size: 16px; }
.search:focus-within { border-color: var(--accent); }
.finder { gap: 10px; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.finder .search { flex: none; min-height: 52px; border-color: var(--line-2); }
.finder .search input { font-size: 17px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 13.5px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }
.select { min-height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 14px; max-width: 100%; }

.empty { border: 1px dashed var(--line-2); border-radius: 14px; padding: 22px; text-align: center; color: var(--muted); font-size: 14px; display: flex; flex-direction: column; gap: 10px; align-items: center; background: var(--surface); }
.empty b { color: var(--ink); font-size: 15px; }
.info { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; background: var(--accent-soft); color: var(--ink); font-size: 14px; }
.info svg { color: var(--accent); margin-top: 1px; }
.info b { display: block; margin-bottom: 2px; }

/* ---------- Dashboard ---------- */
.dash { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
.dash > * { grid-column: span 12; }
@media (min-width: 720px) { .dash > .c-6 { grid-column: span 6; } .dash > .c-4 { grid-column: span 6; } }
@media (min-width: 1180px) { .dash > .c-8 { grid-column: span 8; } .dash > .c-4 { grid-column: span 4; } }
.quick { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.quick .btn { min-height: 54px; justify-content: flex-start; padding: 0 16px; font-size: 15px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--f-body); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.donut-wrap { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.donut-wrap svg { width: 150px; height: 150px; flex-shrink: 0; }
.donut-list { flex: 1 1 160px; min-width: 0; display: flex; flex-direction: column; gap: 7px; font-size: 13px; }
.donut-list div { display: flex; align-items: center; gap: 8px; }
.donut-list .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.donut-list .vl { font-weight: 600; font-variant-numeric: tabular-nums; }
.stack { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--none-soft); }
.stack span { display: block; height: 100%; }
.kv { display: flex; flex-direction: column; gap: 8px; }
.kv > div { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; align-items: center; }
.kv > div > span:first-child { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); min-width: 0; }
.kv b { font-variant-numeric: tabular-nums; }
.todo { display: flex; flex-direction: column; }

let toastTimer;
function toast(msg) {
  const el = $('#toast'); el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 3200);
}
function dbErr(e) {
  console.error(e);
  const msg = String((e && (e.message || e.code)) || '');
  if (/JWT|session|token|401/i.test(msg)) return 'Tu sesión expiró. Vuelve a iniciar sesión.';
  if (/row-level security|permission|42501/i.test(msg)) return 'No tienes permiso para hacer esto.';
  if (/duplicate key/i.test(msg)) return 'Ese registro ya existe.';
  return 'No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.';
}
async function guardar(fn, okMsg) {
  if (!S.db) { toast('Sin conexión con la base de datos. Recarga la página.'); return false; }
  try { await fn(); if (okMsg) toast(okMsg); return true; }
  catch (e) {
    if (e && e.code === 'unavailable') {
      await new Promise(r => setTimeout(r, 600 + Math.random() * 600));
      try { await fn(); if (okMsg) toast(okMsg); return true; } catch (e2) { toast(dbErr(e2)); return false; }
    }
    toast(dbErr(e)); return false;
  }
}

function cardGastosMes() {

  const datos = meses.map(k => { const g = gastosDelMes(k); return { k, bsf: sum(g.filter(x => x.division === 'bsf'), 'total'), kovacs: sum(g.filter(x => x.division === 'kovacs'), 'total'), general: sum(g.filter(x => x.division !== 'bsf' && x.division !== 'kovacs'), 'total') }; });

  const totalCur = datos[5].t, totalPrev = datos[4].t;

  if (!S.gastos.length) {
    body = `<div class="empty"><b>Todavía no hay facturas registradas</b><span>Mándale a Claude por el chat las fotos de las facturas y aparecen aquí, ordenadas por mes, categoría y división.</span><button type="button" class="btn" data-act="como-facturas">${ic('camera')}Cómo cargar facturas</button></div>`;

      if (x.t > 0) svg += `<text x="${cx}" y="${T + ch - ch * x.t / max - 5}" text-anchor="middle" style="font-weight:600;fill:var(--ink)">${esc(clpCorto(x.t).replace('$', ''))}</text>`;

function donut(entries, total, label) {
  const r = 52, C = 2 * Math.PI * r; let off = 0, segs = '';
  entries.forEach(([n, v]) => { const len = C * v / total; segs += `<circle cx="75" cy="75" r="${r}" fill="none" stroke="${colorCat(n)}" stroke-width="24" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 75 75)"><title>${esc(n)}: ${esc(clp(v))}</title></circle>`; off += len; });
  return `<svg viewBox="0 0 150 150" role="img" aria-label="${esc(label)}"><circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--none-soft)" stroke-width="24"/>${segs}<text x="75" y="72" text-anchor="middle" style="font-size:11px;fill:var(--muted);font-family:var(--f-body)">Total</text><text x="75" y="90" text-anchor="middle" style="font-size:15px;font-weight:700;fill:var(--ink);font-family:var(--f-display)">${esc(clpCorto(total))}</text></svg>`;
}
function cardCategorias() {
  let k = mesKey(hoyISO()); let lista = gastosDelMes(k);
  if (!lista.length && S.gastos.length) { k = S.gastos.map(g => mesKey(g.fecha)).sort().pop(); lista = gastosDelMes(k); }
  let body;
  if (!lista.length) body = `<div class="empty"><span>Cuando haya facturas, aquí verás en qué se gasta: bencina, productos de aseo, zapatos, etc.</span></div>`;
  else {
    const e = porCategoria(lista), tot = sum(lista, 'total');
    const top = e.slice(0, 6), resto = e.slice(6).reduce((a, x) => a + x[1], 0);
    if (resto) top.push(['Otras', resto]);
    body = `<div class="donut-wrap">${donut(top, tot, 'Gastos por categoría')}<div class="donut-list">${top.map(([n, v]) => `<div><i class="sw" style="background:${colorCat(n)}"></i><span class="nm">${esc(n)}</span><span class="vl">${esc(clpCorto(v))}</span></div>`).join('')}</div></div>`;
  }
  return `<section class="card c-4"><div class="card-head"><div><h2 class="card-title">Gastos por categoría</h2><div class="card-sub">${esc(k ? mesNombre(k) : '')}</div></div></div>${body}</section>`;
}

  const pct = act.length ? nB / act.length * 100 : 0;
  return `<section class="card c-4">

    ${act.length ? `<div class="stack" aria-hidden="true"><span style="width:${pct}%;background:var(--bsf)"></span><span style="width:${100 - pct}%;background:var(--kov)"></span></div>` : ''}

      <div><span><i class="sw" style="background:var(--bsf)"></i>Bodegas San Francisco</span><b>${nB}</b></div>

}

function cardEntregas(act) {
  const k = mesKey(hoyISO());
  const delMes = S.entregas.filter(e => mesKey(e.fecha) === k);
  const prendasMes = delMes.reduce((a, e) => a + (e.items || []).reduce((b, i) => b + (Number(i.cantidad) || 1), 0), 0);
  const conReg = act.filter(t => S.ultimo[t.id]).length;
  const ult = S.entregas.slice(0, 4);
  const lista = ult.length
    ? `<div class="todo">${ult.map(e => { const t = trabPorId(e.trabajadorId); return `<button type="button" data-act="${t ? 'ficha' : 'entrega'}" data-id="${esc(t ? t.id : e.id)}"><span class="t-ic ok">${ic('shirt')}</span><span class="t-txt"><span class="t-main">${esc(nombreCorto(t ? t.nombre : e.trabajadorNombre))}</span><span class="t-sub">${esc(itemsTxt(e))} · ${esc(hace(e.fecha))}</span></span>${ic('chev')}</button>`; }).join('')}</div>`
    : `<div class="empty"><span>Aún no hay entregas registradas.</span></div>`;
  return `<section class="card c-4">
    <div class="card-head"><div><h2 class="card-title">Entregas de ropa y EPP</h2><div class="big-num">${delMes.length} <small>entregas este mes</small></div><div class="card-sub">${prendasMes} prendas entregadas en ${esc(MES_L[new Date().getMonth()])}</div></div><a class="btn ghost" href="#entregas">Ver</a></div>
    <div class="kv"><div><span>Trabajadores con entregas registradas</span><b>${conReg} de ${act.length}</b></div></div>
    <h3 class="section-t" style="margin:0">Últimas entregas</h3>
    ${lista}
  </section>`;
}

function cardRevisar(act) {
  const items = [];
  const sinRev = S.gastos.filter(g => !g.revisado).length;
  const sinDiv = S.gastos.filter(g => !g.division).length;
  const sinTallas = act.filter(t => !t.tallas || !t.tallas.polera || !t.tallas.pantalon || !t.tallas.zapato).length;
  const sinFirma = S.entregas.filter(firmaPendiente).length;
  if (sinRev) items.push(`<button type="button" data-goto="gastos"><span class="t-ic info">${ic('receipt')}</span><span class="t-txt"><span class="t-main">${sinRev} ${sinRev === 1 ? 'factura' : 'facturas'} por revisar</span><span class="t-sub">${sinDiv ? `${sinDiv} sin división asignada` : 'Confirma categoría y división'}</span></span>${ic('chev')}</button>`);
  if (sinTallas) items.push(`<button type="button" data-goto="personal"><span class="t-ic warn">${ic('user')}</span><span class="t-txt"><span class="t-main">${sinTallas} ${sinTallas === 1 ? 'ficha' : 'fichas'} sin tallas completas</span><span class="t-sub">Agrega talla de polera, pantalón y zapato</span></span>${ic('chev')}</button>`);
  if (sinFirma) items.push(`<button type="button" data-goto="entregas" data-modo="pendientes"><span class="t-ic warn">${ic('pen')}</span><span class="t-txt"><span class="t-main">${sinFirma} ${sinFirma === 1 ? 'entrega' : 'entregas'} con firma pendiente</span><span class="t-sub">Pide al trabajador que firme</span></span>${ic('chev')}</button>`);
  return `<section class="card c-4"><div class="card-head"><h2 class="card-title">Por revisar</h2></div>
    ${items.length ? `<div class="todo">${items.join('')}</div>` : `<div class="todo"><button type="button" disabled style="cursor:default"><span class="t-ic ok">${ic('check')}</span><span class="t-txt"><span class="t-main">Todo al día</span><span class="t-sub">No hay nada pendiente por revisar</span></span></button></div>`}
  </section>`;
}

function filtraTrab(f) {
  const q = norm(f.q), qr = rutLimpio(f.q);
  return S.trab.filter(t => {
    if (f.div === 'baja') { if (t.activo !== false) return false; }
    else { if (t.activo === false) return false; if (f.div !== 'todos' && t.division !== f.div) return false; }
    if (f.grupo && t.grupo !== f.grupo) return false;
    if (q) { const hay = norm(t.nombre).includes(q) || norm(t.cargo).includes(q) || norm(t.grupo).includes(q) || norm(t.lugar).includes(q) || (qr.length >= 3 && rutLimpio(t.rut).includes(qr)); if (!hay) return false; }
    return true;
  }).sort((a, b) => norm(a.nombre).localeCompare(norm(b.nombre)));
}
// Dentro de un área, separa por lugar fijo (ej: Laguna Caren); los sin lugar quedan juntos al final.
function listaConLugares(ts, g) {
  const lugares = [...new Set(ts.map(t => t.lugar || ''))];
  if (lugares.length === 1 && !lugares[0]) return `<div class="list">${ts.map(rowTrab).join('')}</div>`;
  lugares.sort((a, b) => (a ? 0 : 1) - (b ? 0 : 1) || a.localeCompare(b));
  return lugares.map(l => {
    const sub = ts.filter(t => (t.lugar || '') === l);
    return `<h3 class="sub-h ${esc((ts[0] && ts[0].division) || 'general')}">${ic('pin')}<span>${esc(l || 'Resto de ' + (g || 'el área'))}</span><span class="sub-n">${sub.length}</span></h3><div class="list">${sub.map(rowTrab).join('')}</div>`;
  }).join('');
}
function refreshPersonal() {
  const f = S.f.personal;
  const act = activos();
  const sub = $('#pSub'); if (sub) sub.textContent = `${act.length} activos · ${act.filter(t => t.division === 'bsf').length} en Bodegas San Francisco · ${act.filter(t => t.division === 'kovacs').length} en Kovacs · ${S.trab.length - act.length} de baja`;
  const sel = $('#pGrupo');
  if (sel && document.activeElement !== sel) {
    const opts = [];
    if (f.div !== 'kovacs') opts.push(['Bodegas San Francisco', ordenGrupos('bsf')]);
    if (f.div !== 'bsf') opts.push(['Kovacs', ordenGrupos('kovacs')]);
    sel.innerHTML = `<option value="">Todas las áreas y sucursales</option>` + opts.map(([l, gs]) => `<optgroup label="${esc(l)}">${gs.map(g => `<option value="${esc(g)}"${g === f.grupo ? ' selected' : ''}>${esc(g)}</option>`).join('')}</optgroup>`).join('');
    if (f.grupo && !opts.some(o => o[1].includes(f.grupo))) { f.grupo = ''; sel.value = ''; }
  }
  const lista = filtraTrab(f);
  const box = $('#pList'); if (!box) return;
  if (!S.trab.length) { box.innerHTML = `<div class="empty"><b>Todavía no hay trabajadores</b><span>Agrega el primero con el botón “Agregar trabajador”, o mándale la lista a Claude por el chat.</span></div>`; return; }
  if (!lista.length) { box.innerHTML = `<div class="empty"><b>No hay resultados</b><span>Prueba con otro nombre o quita los filtros.</span></div>`; return; }
  const grupos = [];
  const divs = f.div === 'baja' ? ['bsf', 'kovacs'] : (f.div === 'todos' ? ['bsf', 'kovacs'] : [f.div]);
  divs.forEach(dv => {
    const enDiv = lista.filter(t => t.division === dv); if (!enDiv.length) return;
    const orden = ordenGrupos(dv);
    const gs = [...new Set(enDiv.map(lugarDe))].sort((a, b) => { const ia = orden.indexOf(a), ib = orden.indexOf(b); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib); });
    gs.forEach(g => grupos.push({ dv, g, ts: enDiv.filter(t => lugarDe(t) === g) }));
  });
  const otros = lista.filter(t => t.division !== 'bsf' && t.division !== 'kovacs');
  if (otros.length) grupos.push({ dv: '', g: 'Sin división', ts: otros });
  box.innerHTML = grupos.map(({ dv, g, ts }) => `
    <section class="group">
      <h2 class="group-h ${dv || 'general'}"><span class="g-txt"><span class="g-div">${esc(dv ? DIV[dv].nombre : 'Sin división')}</span><span class="g-name">${esc(g || 'Sin área')}</span></span><span class="g-n">${ts.length} ${ts.length === 1 ? 'persona' : 'personas'}</span></h2>
      ${listaConLugares(ts, g)}
    </section>`).join('');
}
function rowTrab(t) {
  const baja = t.activo === false;
  let pills;
  if (baja) pills = `<span class="pill none">De baja${t.fechaBaja ? ' · ' + esc(fCorta(t.fechaBaja)) : ''}</span>`;
  else {
    const last = S.entregas.find(e => e.trabajadorId === t.id);
    pills = (esNuevo(t) ? '<span class="pill new">Nuevo</span>' : '') +
      (last ? `<span class="pill none">Última entrega: ${esc(fCorta(last.fecha))}</span>` : '<span class="pill none">Sin entregas registradas</span>');
  }
  return `<button type="button" class="row" data-act="ficha" data-id="${esc(t.id)}">
    <span class="av ${baja ? 'baja' : esc(t.division)}" aria-hidden="true">${esc(iniciales(t.nombre))}</span>
    <span class="r-name"><b>${esc(t.nombre)}</b><span>${esc(rutFormato(t.rut) || 'Sin RUT')}</span></span>
    <span class="r-meta cargo"><span style="color:var(--ink);font-size:13.5px">${esc(t.cargo || '—')}</span><span class="hide-m">${t.fechaIngreso ? 'Desde ' + esc(fCorta(t.fechaIngreso)) : ''}</span></span>
    <span class="r-meta hide-m"><span>Tallas</span><span style="color:var(--ink)">${esc(tallasTxt(t))}</span></span>
    <span class="r-pills">${pills}</span>
    <span class="r-go">${ic('chev')}</span>
  </button>`;
}
const tallasTxt = t => { const x = t.tallas || {}; return [x.polera || '–', x.pantalon || '–', x.zapato || '–'].join(' · '); };

function refreshEntregas() {
  const f = S.f.entregas, box = $('#eList'); if (!box) return;
  const q = norm(f.q);
  const nPend = S.entregas.filter(firmaPendiente).length;
  const pn = $('#ePendN'); if (pn) pn.textContent = nPend ? `(${nPend})` : '';
  // Subdivisión: áreas de Bodegas SF o sucursales de Kovacs
  const divSel = (f.div === 'bsf' || f.div === 'kovacs') ? f.div : '';
  const gbox = $('#eGrupos');
  if (!divSel) { f.grupo = ''; if (gbox) { gbox.hidden = true; gbox.innerHTML = ''; } }
  else if (gbox) {
    const gs = ordenGrupos(divSel).filter(g => S.trab.some(t => t.division === divSel && t.grupo === g && t.activo !== false));
    if (f.grupo && !gs.includes(f.grupo)) f.grupo = '';
    const gchip = (v, l) => `<button type="button" class="chip sub" data-egrupo="${esc(v)}" aria-pressed="${f.grupo === v}">${esc(l)}</button>`;
    gbox.hidden = false;
    gbox.innerHTML = `<span class="sub-lbl">${divSel === 'bsf' ? 'Área' : 'Sucursal'}</span><div class="chips" role="group" aria-label="${divSel === 'bsf' ? 'Filtrar por área' : 'Filtrar por sucursal'}">${gchip('', 'Todas')}${gs.map(g => gchip(g, g)).join('')}</div>`;
  }
  const pasa = t => t && (f.div === 'todos' || f.div === 'reciente' || t.division === f.div) && (!f.grupo || t.grupo === f.grupo);
  const ordenG = t => { const o = ordenGrupos(t.division); const i = o.indexOf(t.grupo); return i < 0 ? 99 : i; };
  const cmpT = (a, b) => (a.division || '').localeCompare(b.division || '') || ordenG(a) - ordenG(b) || (a.lugar ? 0 : 1) - (b.lugar ? 0 : 1) || (a.lugar || '').localeCompare(b.lugar || '') || norm(a.nombre).localeCompare(norm(b.nombre));
  const grpRow = (t, n, ncol) => `<tr class="grp ${esc(t.division || 'general')}"><td colspan="${ncol}"><span class="g-div">${esc(DIV[t.division] ? DIV[t.division].corto : 'Sin división')}</span>${esc(t.grupo || 'Sin área')}${t.lugar ? ' · ' + esc(t.lugar) : ''}<span class="g-cnt">${n}</span></td></tr>`;
  const conGrupos = (lista, getT, fila, ncol) => {
    let prev = null;
    return lista.map(x => {
      const t = getT(x), key = (t.division || '') + '|' + (t.grupo || '') + '|' + (t.lugar || '');
      let h = '';
      if (key !== prev) { prev = key; h = grpRow(t, lista.filter(y => { const u = getT(y); return (u.division || '') + '|' + (u.grupo || '') + '|' + (u.lugar || '') === key; }).length, ncol); }
      return h + fila(x);
    }).join('');
  };
  const tDe = e => trabPorId(e.trabajadorId) || { division: e.division, grupo: e.grupo, nombre: e.trabajadorNombre || '', cargo: '' };

  if (f.modo === 'estado') {
    const ps = divSel ? prendasDe(divSel) : prendas();
    let ts = activos().filter(t => pasa(t) && (!q || norm(t.nombre).includes(q)));
    if (f.div === 'reciente') ts = ts.filter(t => estadosTrab(t).some(s => s.e.k === 'warn'));
    ts.sort(cmpT);
    if (!ts.length) { box.innerHTML = `<div class="empty"><b>${f.div === 'reciente' ? 'Nadie ha recibido ropa hace poco' : 'No hay trabajadores que mostrar'}</b><span>${f.div === 'reciente' ? 'Aquí aparecen los que recibieron algo hace menos del tiempo mínimo definido en Ajustes.' : 'Prueba quitando los filtros.'}</span></div>`; return; }
    const fila = t => `<tr data-act="ficha" data-id="${esc(t.id)}" tabindex="0"><td class="sticky"><b>${esc(nombreCorto(t.nombre))}</b><span class="d">${esc(t.cargo || '')}</span></td>
        ${(est => ps.map(p => est.find(x => x.p.nombre === p.nombre) || null))(estadosTrab(t)).map(s => !s ? `<td><span class="d">No aplica</span></td>` : `<td>${s.u ? `${esc(fCorta(s.u.fecha))}<span class="d">${esc(hace(s.u.fecha))}</span>${s.e.k === 'warn' ? `<span class="pill warn" style="margin-top:4px">${esc(s.e.t)}</span>` : ''}` : `<span class="pill none">Sin registro</span>`}</td>`).join('')}</tr>`;
    box.innerHTML = `<div class="tbl-wrap"><table class="tbl"><thead><tr><th class="sticky">Trabajador</th>${ps.map(p => `<th>${esc(p.nombre)}<span class="d" style="font-weight:400">${Number(p.meses) ? `cada ${esc(p.meses)} ${Number(p.meses) === 1 ? 'mes' : 'meses'}` : 'sin aviso'}</span></th>`).join('')}</tr></thead><tbody>
      ${conGrupos(ts, t => t, fila, ps.length + 1)}
    </tbody></table></div>
    <p class="sub">Haz clic en un trabajador para ver su ficha y registrarle una entrega. “Muy reciente” significa que se le entregó hace menos del tiempo mínimo que definiste en Ajustes.</p>`;
  } else if (f.modo === 'pendientes') {
    const es = S.entregas.filter(firmaPendiente).filter(e => { const t = tDe(e); return pasa(t) && (!q || norm(t.nombre).includes(q)); })
      .sort((a, b) => cmpT(tDe(a), tDe(b)) || (a.fecha || '').localeCompare(b.fecha || ''));
    if (!es.length) { box.innerHTML = `<div class="empty"><b>No hay firmas pendientes${f.grupo ? ' en ' + esc(f.grupo) : ''}</b><span>Todas las entregas de este grupo están firmadas.</span></div>`; return; }
    const fila = e => { const t = tDe(e); const boton = cls => `<button type="button" class="btn primary ${cls}" data-act="entrega" data-id="${esc(e.id)}" style="min-height:38px">${ic('pen')}Firmar</button>`;
      return `<tr data-act="entrega" data-id="${esc(e.id)}" tabindex="0"><td class="sticky"><b>${esc(t.nombre)}</b><span class="d">${esc(t.cargo || '')}</span>${boton('solo-cel')}</td><td style="white-space:nowrap">${esc(fCorta(e.fecha))}<span class="d">${esc(hace(e.fecha))}</span></td><td>${esc(itemsTxt(e.pedirFirma === true ? e : { items: (e.items || []).filter(esZapato) }))}</td><td class="hide-narrow">${boton('')}</td></tr>`; };
    box.innerHTML = `<div class="info">${ic('pen')}<div><b>${es.length} ${es.length === 1 ? 'entrega espera' : 'entregas esperan'} la firma del trabajador</b>Cuando veas a la persona, toca “Firmar”, pídele que firme con el dedo en la pantalla y toca “Guardar firma”.</div></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th class="sticky">Trabajador</th><th>Fecha de entrega</th><th>Qué se entregó</th><th class="hide-narrow"></th></tr></thead><tbody>
      ${conGrupos(es, tDe, fila, 4)}
    </tbody></table></div>`;
  } else {
    const es = S.entregas.filter(e => { const t = tDe(e); return pasa(t) && (!q || norm(t.nombre).includes(q)); });

    </tbody></table></div>`;
  }
}
const esZapato = i => /^zapatos? de seguridad/.test(norm(i.prenda));
const tieneZapatos = e => (e.items || []).some(esZapato);
// Pendiente: zapatos sin firmar, o cualquier entrega marcada para pedir firma
const firmaPendiente = e => !e.firma && !e.papel && (tieneZapatos(e) || e.pedirFirma === true);
const firmaPill = e => e.firma ? '<span class="pill ok">Firmado</span>' : firmaPendiente(e) ? '<span class="pill warn">Firma pendiente</span>' : e.papel ? '<span class="pill none">En hoja de papel</span>' : '<span class="pill none">Sin firma</span>';
const itemsTxt = e => (e.items || []).map(i => `${i.cantidad || 1} ${i.prenda}${i.talla ? ' (' + i.talla + ')' : ''}`).join(', ');

function refreshGastos() {
  const f = S.f.gastos;
  const mesesSet = new Set(S.gastos.map(g => mesKey(g.fecha)).filter(Boolean)); mesesSet.add(mesKey(hoyISO()));
  const meses = [...mesesSet].sort().reverse();
  if (!f.mes) f.mes = meses[0];
  const sel = $('#gMes');
  if (sel && document.activeElement !== sel) sel.innerHTML = `<option value="todos"${f.mes === 'todos' ? ' selected' : ''}>Todos los meses</option>` + meses.map(k => `<option value="${k}"${k === f.mes ? ' selected' : ''}>${esc(mesNombre(k))}</option>`).join('');
  const q = norm(f.q);
  const lista = S.gastos.filter(g => (f.mes === 'todos' || mesKey(g.fecha) === f.mes) && (f.div === 'todos' || g.division === f.div) && (!q || norm(g.proveedor).includes(q) || norm(g.numero).includes(q) || norm(g.detalle).includes(q)));
  const sub = $('#gSub'); if (sub) sub.textContent = `${f.mes === 'todos' ? 'Todos los meses' : mesNombre(f.mes)} · ${f.div === 'todos' ? 'todas las divisiones' : DIV[f.div].nombre}`;
  const box = $('#gData'); if (!box) return;
  const tot = sum(lista, 'total'), net = sum(lista, 'neto'), iva = sum(lista, 'iva');
  const kpis = `<div class="kpis"><div class="kpi dark"><span>Total</span><b>${esc(clp(tot))}</b></div><div class="kpi"><span>Neto</span><b>${esc(clp(net))}</b></div><div class="kpi"><span>IVA</span><b>${esc(clp(iva))}</b></div><div class="kpi"><span>Facturas</span><b>${lista.length}</b></div></div>`;
  if (!lista.length) {
    box.innerHTML = kpis + `<div class="empty"><b>${S.gastos.length ? 'No hay gastos con estos filtros' : 'Todavía no hay facturas registradas'}</b><span>${S.gastos.length ? 'Prueba con otro mes o división.' : 'Mándale a Claude las fotos de las facturas por el chat, o agrega un gasto a mano.'}</span></div>`;
    return;
  }
  const cats = porCategoria(lista), maxC = cats.length ? cats[0][1] : 1;
  const divs = ['bsf', 'kovacs', 'general'].map(d => [d, sum(lista.filter(g => d === 'general' ? (g.division !== 'bsf' && g.division !== 'kovacs') : g.division === d), 'total')]).filter(x => x[1]);
  const maxD = Math.max(1, ...divs.map(x => x[1]));
  const barras = `<div class="two">
    <section class="card"><h2 class="card-title">Por categoría</h2><div class="bars">${cats.map(([n, v]) => `<div class="b-row"><div class="b-top"><span>${esc(n)}</span><b>${esc(clp(v))}</b></div><div class="b-track"><div class="b-fill" style="width:${(v / maxC * 100).toFixed(1)}%;background:${colorCat(n)}"></div></div></div>`).join('')}</div></section>
    <section class="card"><h2 class="card-title">Por división</h2><div class="bars">${divs.map(([d, v]) => `<div class="b-row"><div class="b-top"><span>${esc(DIV[d].nombre)}</span><b>${esc(clp(v))} <span style="font-weight:500;color:var(--muted)">(${Math.round(v / tot * 100)}%)</span></b></div><div class="b-track"><div class="b-fill" style="width:${(v / maxD * 100).toFixed(1)}%;background:${DIV[d].color}"></div></div></div>`).join('')}</div></section>
  </div>`;
  const filas = lista.slice().sort((a, b) => (b.fecha || '').localeCompare(a.fecha || '') || (b.creado || '').localeCompare(a.creado || ''));
  const tabla = `<section style="display:flex;flex-direction:column;gap:8px"><h2 class="section-t">Facturas (${filas.length})</h2><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Fecha</th><th>Proveedor</th><th>N° factura</th><th>Categoría</th><th>División</th><th class="r">Neto</th><th class="r">IVA</th><th class="r">Total</th><th></th></tr></thead><tbody>
    ${filas.map(g => `<tr data-act="gasto" data-id="${esc(g.id)}" tabindex="0"${!g.revisado ? ' class="flag"' : ''}><td style="white-space:nowrap">${esc(fCorta(g.fecha))}</td><td><b>${esc(g.proveedor || '—')}</b>${g.detalle ? `<span class="d">${esc(g.detalle)}</span>` : ''}</td><td class="num">${esc(g.numero || '—')}</td><td>${esc(g.categoria || '—')}</td><td>${g.division && DIV[g.division] ? `<span class="pill ${esc(g.division)}">${esc(DIV[g.division].corto)}</span>` : '<span class="pill warn">Falta división</span>'}</td><td class="r">${esc(clp(g.neto))}</td><td class="r">${esc(clp(g.iva))}</td><td class="r"><b>${esc(clp(g.total))}</b></td><td style="white-space:nowrap">${!g.revisado ? '<span class="pill warn">Por revisar</span>' : (g.fotoId ? '<span class="pill ok">Con foto</span>' : '')}</td></tr>`).join('')}
    <tr class="foot"><td colspan="5">Total</td><td class="r">${esc(clp(net))}</td><td class="r">${esc(clp(iva))}</td><td class="r">${esc(clp(tot))}</td><td></td></tr>
  </tbody></table></div></section>`;
  box.innerHTML = kpis + barras + tabla;
}

function openSheet(kind, args) {

  $('#sheet').hidden = false;

  const first = $('#sheetPanel [data-focus]') || $('#sheetPanel .sheet-top button');
  if (first) setTimeout(() => first.focus(), 30);
}
function closeSheet() {
  S.sheet = null; $('#sheet').hidden = true; $('#sheetPanel').innerHTML = ''; document.body.style.overflow = '';

}
function renderSheet() {
  if (!S.sheet) return;
  const { kind, args } = S.sheet; const p = $('#sheetPanel');
  const keep = $('.sheet-body', p) ? $('.sheet-body', p).scrollTop : 0;
  if (kind === 'ficha') p.innerHTML = shFicha(args);

    ${t.notas ? `<section class="field"><span class="section-t">Notas</span><p style="white-space:pre-wrap">${esc(t.notas)}</p></section>` : ''}

}
function firmaSVG(f, cls) {
  const d = f && typeof f.d === 'string' && /^[MLl0-9 .\-]*$/.test(f.d) ? f.d : '';
  const w = Number(f && f.w) || 700, h = Number(f && f.h) || 240;
  return `<svg class="${cls}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Firma"><path d="${esc(d)}" fill="none" stroke="currentColor" stroke-width="${cls === 'firma-mini' ? 9 : 5}" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function makePad(canvas, onDraw) {
  const W = 700, H = 420; const ctx = canvas.getContext('2d'); const strokes = []; let cur = null;
  function size() { const r = canvas.getBoundingClientRect(); if (!r.width) return; const dpr = window.devicePixelRatio || 1; canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr); draw(); }
  function pt(ev) { const r = canvas.getBoundingClientRect(); return [Math.max(0, Math.min(W, Math.round((ev.clientX - r.left) / r.width * W))), Math.max(0, Math.min(H, Math.round((ev.clientY - r.top) / r.height * H)))]; }
  function draw() {
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0); ctx.clearRect(0, 0, W, H);
    ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = getComputedStyle(canvas).color;
    for (const s of strokes) { ctx.beginPath(); ctx.moveTo(s[0][0], s[0][1]); if (s.length === 1) ctx.lineTo(s[0][0] + 0.5, s[0][1]); for (let i = 1; i < s.length; i++) ctx.lineTo(s[i][0], s[i][1]); ctx.stroke(); }
  }
  canvas.addEventListener('pointerdown', e => { e.preventDefault(); try { canvas.setPointerCapture(e.pointerId); } catch (_) {} cur = [pt(e)]; strokes.push(cur); draw(); onDraw && onDraw(); });
  canvas.addEventListener('pointermove', e => { if (!cur) return; e.preventDefault(); const p = pt(e), l = cur[cur.length - 1]; if (Math.abs(p[0] - l[0]) + Math.abs(p[1] - l[1]) < 2) return; cur.push(p); draw(); });
  const end = () => { cur = null; };
  canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end); canvas.addEventListener('pointerleave', end);
  const onResize = () => { if (!canvas.isConnected) { window.removeEventListener('resize', onResize); return; } size(); };
  window.addEventListener('resize', onResize);
  requestAnimationFrame(size);
  return {
    clear() { strokes.length = 0; draw(); },
    empty() { return !strokes.some(s => s.length > 1) && strokes.length < 3; },
    data() { return { d: strokes.map(s => 'M' + s[0].join(' ') + (s.length === 1 ? 'l0.5 0' : s.slice(1).map(p => 'L' + p.join(' ')).join(''))).join(''), w: W, h: H }; },
    size
  };
}

  if (d.pdiv) { S.f.personal.div = d.pdiv; S.f.personal.grupo = ''; $$('[data-pdiv]').forEach(b => b.setAttribute('aria-pressed', b.dataset.pdiv === d.pdiv)); refreshPersonal(); return; }

  if (d.ediv) { S.f.entregas.div = d.ediv; S.f.entregas.grupo = ''; $$('[data-ediv]').forEach(b => b.setAttribute('aria-pressed', b.dataset.ediv === d.ediv)); refreshEntregas(); return; }
  if (d.emodo) { S.f.entregas.modo = d.emodo; $$('[data-emodo]').forEach(b => b.setAttribute('aria-pressed', b.dataset.emodo === d.emodo)); refreshEntregas(); return; }
  if (d.gdiv) { S.f.gastos.div = d.gdiv; $$('[data-gdiv]').forEach(b => b.setAttribute('aria-pressed', b.dataset.gdiv === d.gdiv)); refreshGastos(); return; }
  if (d.goto) { if (d.modo) S.f.entregas.modo = d.modo; go(d.goto); return; }
  if (d.tdiv) { $('#tDiv').value = d.tdiv; $$('[data-tdiv]').forEach(b => b.setAttribute('aria-pressed', b.dataset.tdiv === d.tdiv)); $('#tGrupo').innerHTML = grupoOpts(d.tdiv, ''); $('#lGrupo').textContent = d.tdiv === 'kovacs' ? 'Sucursal' : 'Área'; return; }

async function guardarTrabajador(id) {
  const nombre = $('#tNombre').value.trim().replace(/\s+/g, ' ');
  const rutRaw = $('#tRut').value.trim();
  let ok = true;
  const showErr = (elId, msg) => { const e = $('#' + elId); e.textContent = msg; e.hidden = !msg; if (msg) ok = false; };
  showErr('eNombre', nombre ? '' : 'Escribe el nombre.');
  let rut = '';
  if (rutRaw) {
    if (!rutValido(rutRaw)) showErr('eRut', 'El RUT no es válido. Revisa el número y el dígito verificador.');
    else {
      rut = rutFormato(rutRaw);
      const dup = S.trab.find(t => t.id !== id && rutLimpio(t.rut) === rutLimpio(rut));
      showErr('eRut', dup ? `Este RUT ya está registrado (${dup.nombre}${dup.activo === false ? ', de baja' : ''}).` : '');
    }
  } else showErr('eRut', '');
  if (!ok) { toast('Revisa los campos marcados.'); return; }
  const division = $('#tDiv').value || 'bsf';
  const data = {
    nombre, rut, division, grupo: $('#tGrupo').value, lugar: $('#tLugar').value.trim(), cargo: $('#tCargo').value.trim(),
    fechaIngreso: $('#tIngreso').value || '',
    tallas: { polera: $('#tPolera').value, pantalon: $('#tPantalon').value.trim(), zapato: $('#tZapato').value.trim() },
    telefono: $('#tTel').value.trim(), notas: $('#tNotas').value.trim(), actualizado: new Date().toISOString()
  };
  if (id) {
    const done = await guardar(() => S.db.doc('trabajadores/' + id).update(data), 'Cambios guardados');
    if (done) openSheet('ficha', { id });
  } else {
    const nid = uid('t-');
    Object.assign(data, { activo: true, creado: new Date().toISOString() });
    const done = await guardar(() => S.db.doc('trabajadores/' + nid).set(data), `${nombreCorto(nombre)} fue agregado`);
    if (done) openSheet('ficha', { id: nid });
  }
}

async function guardarEntrega() {
  const tid = $('#eTrab').value; const t = trabPorId(tid);
  $('#eTrabErr').hidden = !!t; $('#eTrabErr').textContent = t ? '' : 'Elige al trabajador.';
  const items = [];
  prendasDe(t && t.division).forEach(p => { const st = entForm.items[norm(p.nombre)]; if (st && st.on) items.push({ prenda: p.nombre, talla: (st.talla || '').trim(), cantidad: st.cantidad }); });
  entForm.extras.forEach(x => { if (x.prenda.trim()) items.push({ prenda: x.prenda.trim(), talla: (x.talla || '').trim(), cantidad: x.cantidad }); });
  $('#eItemsErr').hidden = !!items.length; $('#eItemsErr').textContent = items.length ? '' : 'Marca al menos una cosa entregada.';
  if (!t || !items.length) { toast('Falta completar la entrega.'); return; }
  const sinFirma = !padApi || padApi.empty();
  if (sinFirma && !entForm.sinFirmaOk) {
    entForm.sinFirmaOk = true;
    $('#eConfirm').innerHTML = `<div class="confirm warnbox"><b>Falta la firma</b><span style="font-size:13px">Pídele al trabajador que firme en el recuadro. Si no puede ahora, aprieta otra vez “Confirmar entrega” y quedará con firma pendiente.</span></div>`;
    $('#eConfirm').scrollIntoView({ block: 'nearest' });
    return;
  }
  const fecha = $('#eFecha').value || hoyISO();
  const data = { trabajadorId: t.id, trabajadorNombre: t.nombre, division: t.division, grupo: t.grupo || '', fecha, items, firma: sinFirma ? null : padApi.data(), pedirFirma: sinFirma, nota: $('#eNota').value.trim(), creado: new Date().toISOString() };
  const nid = uid('e-');
  const done = await guardar(() => S.db.doc('entregas/' + nid).set(data), 'Entrega registrada');
  if (!done) return;
  // Guardar en la ficha la talla entregada (polera, pantalón, zapato)
  const tallas = Object.assign({}, t.tallas || {}); let cambio = false;
  items.forEach(it => {
    const p = prendasDe(t.division).find(x => norm(x.nombre) === norm(it.prenda));
    if (!p || !p.talla || !it.talla) return;
    const principal = norm(p.nombre).startsWith(p.talla);
    if (!tallas[p.talla] || (principal && tallas[p.talla] !== it.talla)) { tallas[p.talla] = it.talla; cambio = true; }
  });
  if (cambio) await guardar(() => S.db.doc('trabajadores/' + t.id).update({ tallas, actualizado: new Date().toISOString() }));
  openSheet('ficha', { id: t.id });
}

function toRow(o) { const r = {}; Object.entries(o).forEach(([k, v]) => { if (v === undefined) return; const sk = toSnake(k); r[sk] = (DATE_COLS.has(sk) && v === '') ? null : v; }); return r; }

// Misma forma que usaba la versión anterior: S.db.doc('coleccion/id').set/update/delete
const DB = {
  doc(path) {
    const [col, id] = path.split('/');
    if (col === 'config') return { set: data => chk(sb.from('config').upsert({ id, data, actualizado: new Date().toISOString() })) };
    return {
      set: data => chk(sb.from(col).upsert(toRow(Object.assign({ id }, data)))),
      update: data => chk(sb.from(col).update(toRow(data)).eq('id', id)),
      delete: () => chk(sb.from(col).delete().eq('id', id))
    };
  }
};
async function fetchAll(table) {
  let out = [], from = 0;
  for (;;) {
    const { data, error } = await sb.from(table).select('*').order('id').range(from, from + 999);
    if (error) throw error;
    out = out.concat(data || []);
    if (!data || data.length < 1000) break;
    from += 1000;
  }
  return out;
}

// Achica la foto (máx. 2000 px, JPEG) para que suba rápido desde el celular.
async function prepararFoto(file) {
  try {
    const url = URL.createObjectURL(file);
    const img = new Image(); img.src = url; await img.decode();
    const k = Math.min(1, 2000 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    return await new Promise(r => c.toBlob(b => r(b || file), 'image/jpeg', 0.85));
  } catch (_) { return file; }
}

function setConn(st) {
  S.conn = st;
  const dot = $('#connDot'), txt = $('#connTxt');
  dot.className = 'dot' + (st === 'ok' ? ' on' : st === 'sin' ? ' off' : '');
  txt.textContent = st === 'ok' ? 'Datos al día' : st === 'sin' ? 'Sin conexión a los datos' : 'Conectando…';
}
function onData() {
  renderView(false);
  // No redibujar el detalle mientras alguien está firmando
  if (S.sheet && (S.sheet.kind === 'ficha' || (S.sheet.kind === 'entregaDet' && !(padApi && !padApi.empty())))) renderSheet();
}
let reloadTimer = null;
function reloadSoon(ms) { clearTimeout(reloadTimer); reloadTimer = setTimeout(() => { cargarTodo(); }, ms); }
async function cargarTodo() {
  if (!S.session) return;
  try {
    const [c, t, e, g] = await Promise.all([
      sb.from('config').select('*').eq('id', 'general').maybeSingle(),
      fetchAll('trabajadores'), fetchAll('entregas'), fetchAll('gastos')
    ]);
    if (c.error) throw c.error;
    S.config = c.data && c.data.data ? Object.assign({}, DEFAULT_CONFIG, c.data.data) : DEFAULT_CONFIG;
    S.trab = t.map(fromRow);
    S.entregas = e.map(fromRow).sort((a, b) => (b.fecha || '').localeCompare(a.fecha || '') || (b.creado || '').localeCompare(a.creado || ''));
    rebuildUltimo();
    S.gastos = g.map(fromRow);
    S.loaded = { t: true, e: true, g: true, c: true };
    setConn('ok'); onData();
  } catch (err) {
    console.error(err);
    if (/JWT|expired|401/i.test(String(err && err.message))) { await sb.auth.signOut(); mostrarLogin(); return; }
    setConn('sin');
    if (!allLoaded()) renderView(true); else toast('No se pudieron actualizar los datos. Revisa tu conexión.');
  }
}
let canal = null;
function escucharCambios() {
  if (canal) return;
  canal = sb.channel('cambios-full-cleaner').on('postgres_changes', { event: '*', schema: 'public' }, () => reloadSoon(500)).subscribe();
}
function mostrarLogin() {
  S.session = null; S.db = null; S.loaded = { t: false, e: false, g: false, c: false }; S.trab = []; S.entregas = []; S.gastos = []; S.ultimo = {};
  if (canal) { sb.removeChannel(canal); canal = null; }
  if (S.sheet) closeSheet();
  $('#appShell').hidden = true; $('#login').hidden = false;
  document.title = 'Full Cleaner · Iniciar sesión';
  setTimeout(() => { const el = $('#lEmail'); if (el && !el.value) el.focus(); }, 50);
}
function entrar(session) {
  S.session = session; S.email = (session.user && session.user.email) || ''; S.db = DB;
  $('#login').hidden = true; $('#appShell').hidden = false;
  document.title = 'Full Cleaner';
  const ue = $('#userEmail'); if (ue) ue.textContent = S.email;
  setConn('cargando'); route(); cargarTodo(); escucharCambios();
}
$('#loginForm').addEventListener('submit', async ev => {
  ev.preventDefault();
  const email = $('#lEmail').value.trim(), password = $('#lPass').value;
  const err = $('#lErr'); err.hidden = true;
  if (!email || !password) { err.textContent = 'Escribe tu correo y tu contraseña.'; err.hidden = false; return; }
  const btn = $('#lBtn'); btn.disabled = true; btn.textContent = 'Entrando…';
  let res;
  try { res = await sb.auth.signInWithPassword({ email, password }); } catch (e) { res = { error: e }; }
  btn.disabled = false; btn.textContent = 'Entrar';
  if (res.error || !res.data || !res.data.session) {
    err.textContent = res.error && /invalid/i.test(res.error.message || '') ? 'Correo o contraseña incorrectos.' : 'No se pudo iniciar sesión. Revisa tu conexión e inténtalo de nuevo.';
    err.hidden = false; return;
  }
  $('#lPass').value = '';
  entrar(res.data.session);
});
async function init() {
  if (!sb) {
    $('#login').hidden = false;
    $('#lErr').textContent = 'No se pudo cargar la conexión. Revisa tu internet y recarga la página.'; $('#lErr').hidden = false;
    return;
  }
  let session = null;
  try { const { data } = await sb.auth.getSession(); session = data && data.session; } catch (_) {}
  if (session) entrar(session); else mostrarLogin();
  sb.auth.onAuthStateChange((ev, ses) => {
    if (ev === 'SIGNED_OUT') { if (S.session) mostrarLogin(); }
    else if (ses) S.session = ses;
  });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.session) reloadSoon(100); });
}
init();
})();
</script>
